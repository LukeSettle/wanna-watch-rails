development:
  adapter: async

test:
  adapter: test

# Uses Redis when REDIS_URL is set (needed for multiple instances). With a
# single instance (like the current Render setup) the in-process async
# adapter works and requires no Redis.
production:
  adapter: <%= ENV["REDIS_URL"].present? ? "redis" : "async" %>
  url: <%= ENV["REDIS_URL"] %>
  channel_prefix: wanna_watch_rails_production
